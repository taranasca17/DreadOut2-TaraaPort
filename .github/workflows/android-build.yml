name: Build DreadOut 2 TaraaPort APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Memungkinkan tombol "Run workflow" diklik manual di web GitHub

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Ambil Kode Proyek
        uses: actions/checkout@v4

      - name: 2. Siapkan Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Siapkan Android SDK & NDK r26d
        uses: android-actions/setup-android@v3

      - name: 4. Instal NDK 26.3.11579264 & CMake 3.22.1
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: 5. Siapkan Gradle 8.7 (Otomatis tanpa gradle-wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 6. Compile Kode C++ Vulkan & Build APK Debug
        run: gradle :app:assembleDebug --stacktrace

      - name: 7. Sediakan File APK untuk Diunduh
        uses: actions/upload-artifact@v4
        with:
          name: DreadOut2-TaraaPort-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk