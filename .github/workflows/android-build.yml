name: Build DreadOut 2 TaraaPort APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Ambil Kode Proyek
        uses: actions/checkout@v4

      - name: 2. Siapkan Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setujui Lisensi Android SDK Otomatis
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 4. Siapkan Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 5. Compile Kode C++ Vulkan & Build APK Debug
        run: gradle :app:assembleDebug --stacktrace

      - name: 6. Sediakan File APK untuk Diunduh
        uses: actions/upload-artifact@v4
        with:
          name: DreadOut2-TaraaPort-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk